name: Tag, build and release on manifest version change (auto-bumps if code changed)

on:
  push:
    branches: [ main ]

jobs:
  tag-build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # If plugin code changed since the last release but nobody raised the version,
      # raise the last number by one (1.0.24 -> 1.0.25) and commit it, so every change
      # ships as a new version Obsidian can scan. Docs and workflow-only changes are skipped.
      - name: Auto-bump version when code changed without a bump
        run: |
          LAST_TAG=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          CUR=$(jq -r '.version' manifest.json)
          if [ -z "$LAST_TAG" ]; then
            echo "No earlier release tag, nothing to bump."
            exit 0
          fi
          HIGHEST=$(printf '%s\n%s\n' "$CUR" "$LAST_TAG" | sort -V | tail -n1)
          if [ "$CUR" != "$LAST_TAG" ] && [ "$HIGHEST" = "$CUR" ]; then
            echo "Version already raised to $CUR, no auto-bump needed."
            exit 0
          fi
          CHANGED=$(git diff --name-only "$LAST_TAG" HEAD -- . \
            ':(exclude)*.md' ':(exclude)docs/**' ':(exclude).github/**' \
            ':(exclude)LICENSE' ':(exclude)versions.json' ':(exclude)manifest.json' ':(exclude)package.json')
          if [ -z "$CHANGED" ]; then
            echo "No plugin code changed since $LAST_TAG, no new release."
            exit 0
          fi
          echo "Code changed since $LAST_TAG:"
          echo "$CHANGED"
          IFS='.' read -r MAJ MIN PAT <<< "$LAST_TAG"
          NEW="$MAJ.$MIN.$((PAT + 1))"
          echo "Auto-bumping version to $NEW"
          MIN_APP=$(jq -r '.minAppVersion' manifest.json)
          jq --tab --arg v "$NEW" '.version = $v' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          jq --tab --arg v "$NEW" --arg m "$MIN_APP" '. + {($v): $m}' versions.json > versions.tmp && mv versions.tmp versions.json
          jq --tab --arg v "$NEW" '.version = $v' package.json > package.tmp && mv package.tmp package.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json versions.json package.json
          git commit -m "Bump version to $NEW"
          git push origin HEAD:main

      - name: Read version from manifest.json
        id: ver
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          NAME=$(jq -r '.name' manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Get latest GitHub release tag
        id: latest
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const { owner, repo } = context.repo;
            try {
              const rel = await github.rest.repos.getLatestRelease({ owner, repo });
              return rel.data.tag_name || '';
            } catch (e) {
              if (e.status === 404) {
                return '';
              }
              throw e;
            }

      - name: Compare manifest version with latest release
        id: vercmp
        run: |
          LATEST='${{ steps.latest.outputs.result }}'
          CUR='${{ steps.ver.outputs.version }}'
          parse_semver() {
            IFS='.' read -r MAJ MIN PAT <<< "$1"
            echo "${MAJ:-0} ${MIN:-0} ${PAT:-0}"
          }
          cmp_versions() {
            # returns 0 if $1 > $2, else 1
            read -r A1 A2 A3 <<< "$(parse_semver "$1")"
            read -r B1 B2 B3 <<< "$(parse_semver "$2")"
            if [ "$A1" -gt "$B1" ]; then return 0; fi
            if [ "$A1" -lt "$B1" ]; then return 1; fi
            if [ "$A2" -gt "$B2" ]; then return 0; fi
            if [ "$A2" -lt "$B2" ]; then return 1; fi
            if [ "$A3" -gt "$B3" ]; then return 0; fi
            return 1
          }
          if [ -z "$LATEST" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            if cmp_versions "$CUR" "$LATEST"; then
              echo "should_release=true" >> $GITHUB_OUTPUT
            else
              echo "should_release=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Determine if tag already exists
        id: tag_check
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.ver.outputs.version }}"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate release notes body
        if: steps.vercmp.outputs.should_release == 'true'
        id: notes
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const { owner, repo } = context.repo;
            const current = process.env.CURRENT;
            const previous = process.env.PREVIOUS;
            let notes = '';
            try {
              const res = await github.rest.repos.generateReleaseNotes({
                owner, repo,
                tag_name: current,
                previous_tag_name: previous || undefined,
              });
              notes = res.data.body || '';
              // Remove any default "Full Changelog:" lines GitHub may include
              notes = notes
                .split('\n')
                .filter(line => !/^\*\*Full Changelog\*\*:/i.test(line.trim()))
                .join('\n')
                .trim();
            } catch (e) {
              // Fallback to empty notes
              notes = '';
            }
            if (previous) {
              const url = `https://github.com/${owner}/${repo}/compare/${previous}...${current}?diff=split&w=1`;
              notes += `${notes ? '\n\n' : ''}[Here's a List of What Has Changed Since the Last Version of This Plugin](${url})`;
            }
            return notes;
        env:
          CURRENT: ${{ steps.ver.outputs.version }}
          PREVIOUS: ${{ steps.latest.outputs.result }}

      - name: Create and push tag
        if: steps.tag_check.outputs.exists == 'false' && steps.vercmp.outputs.should_release == 'true'
        run: |
          git tag ${{ steps.ver.outputs.version }}
          git push origin ${{ steps.ver.outputs.version }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        if: steps.vercmp.outputs.should_release == 'true'
        run: npm run build

      - name: Prepare release artifacts
        if: steps.vercmp.outputs.should_release == 'true'
        run: |
          # Ensure required files exist
          test -f main.js
          test -f manifest.json
          test -f styles.css

      - name: Attest release artifacts
        if: steps.vercmp.outputs.should_release == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release and upload assets (published, never draft, since Obsidian ignores drafts)
        if: steps.vercmp.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Santi Younger Tools ${{ steps.ver.outputs.version }}
          draft: false
          prerelease: false
          body: ${{ steps.notes.outputs.result }}
          files: |
            main.js
            manifest.json
            styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
